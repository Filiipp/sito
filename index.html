<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>projectbE</title>
<meta name="description" content="Sfoglia i prodotti per categoria e richiedi informazioni con un tocco.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
:root {
  --bg: #0d0b18;        /* Viola scurissimo quasi nero */
  --card: #18142a;      /* Viola scuro profondo */
  --ink: #f4f4f8;       /* Bianco caldo */
  --muted: #a5a1b8;     /* Lavanda desaturato */
  --line: #2d264a;      /* Bordo tono su tono */
  --accent: #06d49a;    
  --accent-ink: #000000;
  --soft: #231d3d;      /* Sfondo placeholder */
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);
  font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5}
a{color:inherit}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px}

header{padding:56px 0 28px;text-align:center}
header h1{margin:0 0 12px;line-height:0}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.print-title{width:100%;max-width:680px;display:block;margin:0 auto;overflow:visible}
.print-title text{font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;font-weight:800;font-size:120px;letter-spacing:-2px}
.pt-fill{fill:var(--accent)}
.pt-fill-lines{fill:url(#ptLines)}
.pt-bed{fill:var(--muted)}
.pt-beam{fill:var(--line)}
.pt-head{fill:var(--ink)}
.pt-glow{fill:#F2A33A}
header p{margin:0 auto;max-width:52ch;color:var(--muted);font-size:1.1rem}

.tools{position:sticky;top:0;z-index:5;background:var(--bg);padding:14px 0;border-bottom:1px solid var(--line)}
.search{width:100%;padding:13px 16px;font:inherit;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--ink)}
.chips{display:flex;gap:8px;margin-top:12px;overflow-x:auto;padding-bottom:4px}
.chip{flex:none;font:inherit;font-weight:600;padding:8px 16px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}

.count{margin:22px 0 14px;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px;padding-bottom:60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.photo{aspect-ratio:4/3;background:var(--soft);display:grid;place-items:center;font-size:3rem;font-weight:800;color:var(--accent)}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.body{padding:16px;display:flex;flex-direction:column;gap:6px;flex:1}
.cat{font-size:.85rem;color:var(--muted)}
.body h3{margin:0;font-size:1.2rem}
.body p{display: -webkit-box;
  -webkit-line-clamp: 4; /* Mostra solo 2 righe prima dei "..." */
  -webkit-box-orient: vertical;
  overflow: hidden;
  white-space: pre-line;margin:0;color:var(--muted);font-size:.95rem;flex:1}
.price{font-weight:800;font-size:1.15rem;margin-top:6px}
.actions{display:flex;gap:8px;margin-top:10px}
.btn{flex:1;text-align:center;text-decoration:none;font-weight:600;padding:10px 12px;border-radius:9px;border:1px solid var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.ghost{color:var(--accent)}
.btn:hover{filter:brightness(.92)}
.empty{grid-column:1/-1;padding:40px 0;color:var(--muted)}

footer{border-top:1px solid var(--line);padding:28px 0 40px;color:var(--muted);font-size:.95rem}
/* --- Animazione Lift & Shadow pulsanti --- */
.card {
  transition: transform 0.25s ease, box-shadow 0.25s ease;
}
/* Sollevamento più marcato per le carte prodotto */
.card:hover {
  transform: translateY(-6px);
  box-shadow: 0 12px 24px rgba(250, 249, 249, 0.6);
}

/* --- Animazione Sottolineatura da sinistra per le Categorie --- */
.chip {
  position: relative; /* Necessario per agganciare la linea animata al bottone */
  overflow: hidden; /* Fondamentale: fa sì che la linea non esca fuori dai bordi arrotondati */
}
/* Creiamo la linea nascosta alla base del bottone */
.chip::after {
  content: "";
  position: absolute;
  bottom: 0;
  left: 0;
  width: 100%;
  height: 3px; /* Spessore della sottolineatura */
  background-color: var(--accent); /* Colore ciano brillante */
  transform: scaleX(0); /* Inizialmente la larghezza è 0 */
  transform-origin: left; /* Imposta l'origine dell'animazione a sinistra */
  transition: transform 0.3s ease; /* Durata dell'animazione */
}
/* Al passaggio del mouse, la linea si estende al 100% */
.chip:hover::after {
  transform: scaleX(1);
}
/* --- Autocomplete Suggerimenti --- */
.search-wrap {
  position: relative;
  width: 100%;
}

.suggestions {
  position: absolute;
  top: calc(100% + 6px); /* Distanza di 6px sotto la barra */
  left: 0;
  right: 0;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 10px;
  z-index: 10;
  max-height: 250px;
  overflow-y: auto;
  display: none; /* Nascosto di default */
  box-shadow: 0 10px 25px rgba(0, 0, 0, 0.6);
}

.suggestions.active {
  display: block; /* Mostra la tendina quando ci sono suggerimenti */
}

.suggestion-item {
  padding: 12px 16px;
  cursor: pointer;
  border-bottom: 1px solid var(--line);
  display: flex;
  justify-content: space-between;
  align-items: center;
  transition: background 0.2s;
}

.suggestion-item:last-child {
  border-bottom: none;
}

.suggestion-item:hover {
  background: var(--soft); /* Illumina la riga al passaggio del mouse */
}

.suggestion-item .s-name {
  font-weight: 600;
  color: var(--ink);
}

.suggestion-item .s-cat {
  font-size: 0.8rem;
  color: var(--muted);
}
/* --- Intestazioni di Categoria --- */
.category-header {
  grid-column: 1 / -1; /* Fa espandere il testo su tutte le colonne della griglia */
  font-size: 1rem;
  font-weight: 800;
  color: var(--ink);
  padding-bottom: 8px;
  margin-top: 24px;
  position: relative;
}
.category-header::after {
  content: "";
  position: absolute;
  bottom: 0;
  left: 0; /* Allinea la linea a sinistra */
  width: 80px; /* Modifica qui la lunghezza */
  height: 4px; 
  background-color: var(--accent); 
  border-radius: 2px; 
}
.category-header:first-child {
  margin-top: 0; /* Rimuove lo spazio extra per la primissima categoria */
}
/* --- Modal (Grow) e Galleria Foto --- */
.modal { 
  display: none; 
  position: fixed; 
  inset: 0; 
  background: rgba(0,0,0,0.8); 
  z-index: 100; /* Alzato per coprire l'header sticky */
  place-items: center; 
  padding: 20px; 
}
.modal-content { 
  background: var(--card); 
  padding: 20px; 
  border-radius: 14px; 
  width: 100%; 
  max-width: 500px; 
  animation: grow 0.3s ease; 
}
@keyframes grow { 
  from { transform: scale(0.8); opacity: 0; } 
  to { transform: scale(1); opacity: 1; } 
}
.gallery { 
  display: flex; 
  overflow-x: auto; 
  scroll-snap-type: x mandatory; 
  gap: 10px; 
  margin-bottom: 15px; 
}
.gallery img {
  width: 100%;
  flex-shrink: 0;
  scroll-snap-align: center;
  border-radius: 8px;
  aspect-ratio: 4/3;
  object-fit: contain; /* Risolve il problema del taglio forzato */
  background: var(--soft); /* Mantiene un colore di fondo omogeneo se l'immagine ha proporzioni diverse */
}
#modal-desc{white-space:pre-line;color:var(--muted);margin:0}
.gallery-wrapper {
  position: relative;
  margin-bottom: 15px;
}

.nav-btn {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  background: var(--card);
  color: var(--ink);
  border: 1px solid var(--line);
  border-radius: 50%;
  width: 40px;
  height: 40px;
  cursor: pointer;
  z-index: 5;
  display: grid;
  place-items: center;
  font-size: 1.2rem;
  box-shadow: 0 4px 10px rgba(0,0,0,0.5);
  transition: background 0.2s, color 0.2s;
}

.nav-btn:hover {
  background: var(--accent);
  color: var(--accent-ink);
}

.nav-btn.left { left: -10px; }
.nav-btn.right { right: -10px; }

/* Nascondiamo la barra di scorrimento nativa per un design più pulito */
.gallery::-webkit-scrollbar { display: none; }
.gallery { -ms-overflow-style: none; scrollbar-width: none; margin-bottom: 0; }
</style>

<script>
/* =====================================================
   ANIMAZIONE TITOLO (stampa 3D strato dopo strato)
   ===================================================== */
(function(){
  const svg = document.getElementById("printTitle"); if(!svg) return;
  const NS = "http://www.w3.org/2000/svg";
  const fill = document.getElementById("ptFill");
  const clipG = document.getElementById("ptClip");
  const gantry = document.getElementById("ptGantry");
  const beamG = document.getElementById("ptBeamG");
  const beam = document.getElementById("ptBeam");
  const bed = document.getElementById("ptBed");
  const N = 44;                       // numero di strati
  const BUILD = 5000 //HOLD = 5000;    // ms: durata stampa e pausa a titolo finito

  function setup(){
    const b = fill.getBBox();
    const fs = parseFloat(getComputedStyle(fill).fontSize) || 120;
    const base = parseFloat(fill.getAttribute("y"));
    const x0 = b.x, w = b.width;
    const top = base - fs*0.76;        // altezza delle lettere più alte (b)
    const bottom = base + fs*0.22;     // profondità delle discendenti (p, j)
    const H = (bottom-top)/N;

    // piano di stampa
    bed.setAttribute("x", x0-24); bed.setAttribute("width", w+48);
    bed.setAttribute("y", bottom+2); bed.setAttribute("height", 10); bed.setAttribute("rx", 4);

    // binario orizzontale
    beam.setAttribute("x", x0-24); beam.setAttribute("width", w+48);

    // righe sottili che simulano gli strati
    const pat = document.getElementById("ptLines");
    pat.setAttribute("height", H); pat.setAttribute("y", bottom);
    document.getElementById("ptLine").setAttribute("height", Math.min(1.2, H/3));

    // un rettangolo di clip per ogni strato
    const rects = [];
    for(let i=0;i<N;i++){
      const r = document.createElementNS(NS,"rect");
      r.setAttribute("y", bottom-(i+1)*H);
      r.setAttribute("height", H+0.6);
      clipG.appendChild(r); rects.push(r);
    }

    function draw(layer, f){
      for(let i=0;i<N;i++){
        const vis = i < layer ? w : (i === layer ? w*f : 0);
        const right = i%2===0;
        rects[i].setAttribute("width", Math.max(vis,0));
        rects[i].setAttribute("x", right ? x0 : x0+w-vis);
      }
      if(layer>=N){ gantry.style.opacity=0; beamG.style.opacity=0; return; }
      const right = layer%2===0;
      const x = right ? x0+w*f : x0+w-w*f;
      const y = bottom-(layer+1)*H;
      gantry.style.opacity=1; beamG.style.opacity=1;
      gantry.setAttribute("transform",`translate(${x},${y-12})`);
      beamG.setAttribute("transform",`translate(0,${y-12-22+8})`);
    }

    if(window.matchMedia("(prefers-reduced-motion: reduce)").matches){ draw(N,0); return; }

    let t0=null;
    function frame(ts){
      if(t0===null) t0=ts;
      const t=ts-t0;
      if(t>=BUILD){ draw(N,0); return; }   // stampa finita: si ferma qui
      const p=t/BUILD*N, l=Math.floor(p);
  draw(l,p-l);
      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  }

  // aspetta il caricamento del font, altrimenti le misure del testo sono sbagliate
  const fontPronto = document.fonts && document.fonts.load
    ? document.fonts.load('800 120px "Bricolage Grotesque"', 'projectbE')
    : Promise.resolve();
  fontPronto.catch(()=>{}).then(()=> document.fonts ? document.fonts.ready : null).then(setup);
})();

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let categoria = "Tutti";
let prodottiCorrenti = [];

const categorie = ["Tutti", ...new Set(Stampe.map(p => p.categoria))];

function disegnaChips(){
  $("chips").innerHTML = categorie.map(c =>
    `<button class="chip" aria-pressed="${c===categoria}" data-c="${esc(c)}">${esc(c)}</button>`).join("");
}

function linkWhatsApp(p){
  const t = `Salve, sono interessato a "${p.nome}" (${p.categoria}). Potete darmi maggiori informazioni?`;
  return `https://wa.me/${CONTATTI.whatsapp}?text=${encodeURIComponent(t)}`;
}
function linkEmail(p){
  const s = `Richiesta informazioni: ${p.nome}`;
  const b = `Salve,\n\nsono interessato al prodotto "${p.nome}" (${p.categoria}).\nPotete darmi maggiori informazioni?\n\nGrazie`;
  return `mailto:${CONTATTI.email}?subject=${encodeURIComponent(s)}&body=${encodeURIComponent(b)}`;
}

function disegna(){
  const q = $("q").value.trim().toLowerCase();
  
  const lista = Stampe.filter(p =>
    (categoria === "Tutti" || p.categoria === categoria) &&
    (!q || (p.nome + " " + p.descrizione + " " + p.categoria).toLowerCase().includes(q))
  ).sort((a, b) => a.categoria.localeCompare(b.categoria));

  // SALVA LA LISTA ATTUALE PER IL MODAL
  prodottiCorrenti = lista;

  $("count").textContent = lista.length === 1 ? "1 prodotto" : lista.length + " prodotti";
  
  $("grid").innerHTML = lista.length ? lista.map((p, i, arr) => {
    let html = "";
    
    if (categoria === "Tutti" && (i === 0 || p.categoria !== arr[i-1].categoria)) {
      html += `<div class="category-header">${esc(p.categoria)}</div>`;
    }
    
    // Controlliamo la prima foto da mostrare nella card (gestendo se è un array o no)
    let primaFoto = "";
    if (Array.isArray(p.foto) && p.foto.length > 0) primaFoto = p.foto[0];
    else if (typeof p.foto === "string") primaFoto = p.foto;

    html += `
      <article class="card">
        <!-- AGGIUNTO L'ONCLICK PER APRIRE IL MODAL -->
        <div class="photo" onclick="apriModal(${i})" style="cursor:pointer">
          ${primaFoto ? `<img src="${esc(primaFoto)}" alt="${esc(p.nome)}" loading="lazy">` : esc(p.nome.charAt(0))}
        </div>
        <div class="body">
          <span class="cat">${esc(p.categoria)}</span>
          <h3>${esc(p.nome)}</h3>
          <p>${esc(p.descrizione)}</p>
          <div class="price">${esc(p.prezzo)}</div>
          <div class="actions">
            <a class="btn primary" href="${linkWhatsApp(p)}" target="_blank" rel="noopener">WhatsApp</a>
            <a class="btn ghost" href="${linkEmail(p)}">Email</a>
          </div>
        </div>
      </article>`;
    return html;
  }).join("")
  : `<p class="empty">Nessun prodotto trovato. Prova con un'altra parola o categoria.</p>`;
}

$("chips").addEventListener("click", e => {
  const b = e.target.closest(".chip"); if(!b) return;
  categoria = b.dataset.c; disegnaChips(); disegna();
});
const qInput = $("q");
const suggestionsBox = $("suggestions");
suggestionsBox.addEventListener("click", e => {
  const it = e.target.closest(".suggestion-item"); if(!it) return;
  selezionaSuggerimento(it.dataset.nome);
});

qInput.addEventListener("input", (e) => {
  const q = e.target.value.trim().toLowerCase();
  disegna(); // Aggiorna comunque la griglia principale sotto
  
  if (!q) {
    suggestionsBox.classList.remove("active");
    return;
  }

  // Cerca i prodotti corrispondenti (mostriamo massimo 5 suggerimenti)
  const suggeriti = Stampe.filter(p => 
    p.nome.toLowerCase().includes(q) || 
    p.categoria.toLowerCase().includes(q)
  ).slice(0, 5);

  if (suggeriti.length > 0) {
    // Disegna la lista dei suggerimenti
    suggestionsBox.innerHTML = suggeriti.map(p => `
       <div class="suggestion-item" data-nome="${esc(p.nome)}">
    <span class="s-name">${esc(p.nome)}</span>
    <span class="s-cat">${esc(p.categoria)}</span>
  </div>
    `).join("");
    suggestionsBox.classList.add("active");
  } else {
    suggestionsBox.classList.remove("active");
  }
});

// Funzione chiamata quando clicchi su un suggerimento
window.selezionaSuggerimento = function(nome) {
  qInput.value = nome; // Inserisce il nome nella barra
  suggestionsBox.classList.remove("active"); // Chiude la tendina
  disegna(); // Filtra la griglia mostrando solo quel prodotto
};

// Se clicchi fuori dalla barra o dalla tendina, nasconde i suggerimenti
document.addEventListener("click", (e) => {
  if (!e.target.closest(".search-wrap")) {
    suggestionsBox.classList.remove("active");
  }
});

/* --- Gestione Finestra Modal (Grow) --- */

function apriModal(indice) {
  const p = prodottiCorrenti[indice];
  if (!p) return;
  
  const gallery = document.getElementById("modal-gallery");
  const btnPrev = document.getElementById("btn-prev");
  const btnNext = document.getElementById("btn-next");
  
  if (Array.isArray(p.foto) && p.foto.length > 0) {
    gallery.innerHTML = p.foto.map(f => `<img src="${esc(f)}">`).join('');
    // Mostra i bottoni solo se c'è più di 1 foto nell'array
    const mostraBottoni = p.foto.length > 1 ? "grid" : "none";
    btnPrev.style.display = mostraBottoni;
    btnNext.style.display = mostraBottoni;
  } else if (typeof p.foto === "string" && p.foto.trim() !== "") {
    gallery.innerHTML = `<img src="${esc(p.foto)}">`;
    btnPrev.style.display = "none";
    btnNext.style.display = "none";
  } else {
    gallery.innerHTML = '';
    btnPrev.style.display = "none";
    btnNext.style.display = "none";
  }
  
  document.getElementById("modal-desc").textContent = p.descrizione_lunga || p.descrizione;
  document.getElementById("modal").style.display = "grid";
}

// Nuova funzione per gestire lo scorrimento automatico al clic del pulsante
function scorriGalleria(direzione) {
  const gallery = document.getElementById("modal-gallery");
  const larghezzaFoto = gallery.clientWidth; 
  gallery.scrollBy({ left: direzione * larghezzaFoto, behavior: 'smooth' });
}
